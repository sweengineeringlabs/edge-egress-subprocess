[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
futures   = "0.3"
serde     = { version = "1.0", features = ["derive"] }
thiserror = "2"
tokio     = { version = "1.52", features = ["process", "time", "io-util", "macros"] }
tracing   = { version = "0.1", default-features = false, features = ["std"] }
swe-edge-configbuilder = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.3.0" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["resource"] }

[dev-dependencies]
tokio                  = { version = "1.52", features = ["macros", "rt-multi-thread"] }
swe-edge-configbuilder = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.3.0" }
