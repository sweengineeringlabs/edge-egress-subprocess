[workspace]
resolver = "2"
members  = [
  "subprocess",
  "isolator",
  "resource-policy",
]

[workspace.package]
version      = "0.3.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
rust-version = "1.95"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/edge-egress-subprocess.git"

[workspace.dependencies]
swe-edge-egress-subprocess = { path = "./subprocess" }
swe-edge-configbuilder     = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.3.0" }

[workspace.lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
