[package]
name                   = "swe-edge-egress-subprocess"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
description  = "edge — egress subprocess execution: ProcessRunner trait and DefaultProcessRunner."
keywords     = ["process", "subprocess", "egress", "sea", "swe"]
categories   = ["os"]

[package.metadata.struct-engine]
application_type = "lib"
service_type     = "processor"

[lib]
path = "main/src/lib.rs"

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
futures   = "0.3"
serde     = { version = "1.0", features = ["derive"] }
thiserror = "2"
tokio     = { version = "1.52", features = ["process", "time", "io-util", "macros"] }
tracing   = { version = "0.1", default-features = false, features = ["std"] }
swe-edge-configbuilder = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["resource"] }

[dev-dependencies]
tokio                  = { version = "1.52", features = ["macros", "rt-multi-thread"] }
swe-edge-configbuilder = { workspace = true }
